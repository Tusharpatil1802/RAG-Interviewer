[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "EMBEDDING_MODEL,EMBEDDING_PROVIDER,GROQ_MODEL,MAX_TURNS,OPENAI_MODEL,SUPABASE_KB_BUCKET,SUPABASE_REPORT_BUCKET,SUPABASE_RESUME_BUCKET"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
